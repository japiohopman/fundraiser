name: Foundation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project foundation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/story.md"
            "docs/fundraisers.md"
            "docs/editorial-policy.md"
            "docs/roadmap.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required foundation file: $file"; exit 1; }
          done

          echo "Foundation files present."
