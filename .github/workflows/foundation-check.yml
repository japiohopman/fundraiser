name: Foundation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required by Content Guard to compare the PR against origin/main.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project foundation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/story.md"
            "docs/fundraisers.md"
            "docs/editorial-policy.md"
            "docs/roadmap.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required foundation file: $file"; exit 1; }
          done

          echo "Foundation files present."

      - name: Run Orchestrator Tests
        run: node --test scripts/jules-orchestrator.test.mjs

      - name: Run QR and Share Tests
        run: node --test scripts/qr-share.test.mjs

      - name: Run ParkNest Context Tests
        run: node --test scripts/parknest-context.test.mjs

      - name: Run Metadata Tests
        run: node --test scripts/metadata.test.mjs

      - name: Run Content Guard
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/content-guard.mjs
