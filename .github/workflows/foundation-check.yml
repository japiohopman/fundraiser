name: Foundation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required by Content Guard to compare the PR against origin/main.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project foundation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/story.md"
            "docs/fundraisers.md"
            "docs/editorial-policy.md"
            "docs/roadmap.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required foundation file: $file"; exit 1; }
          done

          echo "Foundation files present."

      - name: Validate JSON Schemas
        run: |
          npx --yes -p ajv-cli -p ajv-formats ajv validate -s data/fundraisers.schema.json -d data/fundraisers.json -c ajv-formats --spec=draft2020
          npx --yes -p ajv-cli -p ajv-formats ajv validate -s data/donors.schema.json -d data/donors.json -c ajv-formats --spec=draft2020

      - name: Validate HTML Markup
        run: npx --yes html-validate index.html

      - name: Run Automated Test Suite
        run: node --test scripts/*.test.mjs

      - name: Run Content Guard
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/content-guard.mjs

      - name: Run External Link Integrity Check
        run: node scripts/link-check.mjs
