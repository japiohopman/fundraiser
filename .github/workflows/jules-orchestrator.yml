name: Jules Queue Orchestrator

# Single Jules automation path:
# - workflow_dispatch is the manual bootstrap/recovery entry point.
# - merged PRs targeting main automatically advance the queue.
# There is intentionally no second Jules workflow and no polling cron.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: jules-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Queue state is authoritative on main. Do not let a manual run from another
          # branch accidentally read or write a branch-local queue.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preflight queue state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { findTasksBeforeReady, findNextDispatchableTask, parseNow, parsePhase3 } from './scripts/jules-orchestrator.mjs';

          const roadmap = readFileSync('docs/roadmap.md', 'utf8');
          const queueProblems = findTasksBeforeReady(roadmap);
          if (queueProblems.length) {
            console.error('Invalid Jules queue: task found before ### Ready:');
            for (const problem of queueProblems) console.error('- ' + problem);
            process.exit(1);
          }

          const readyTasks = parseNow(roadmap);
          const phase3Tasks = parsePhase3(roadmap);
          const next = findNextDispatchableTask(readyTasks, phase3Tasks);
          const queue = JSON.parse(readFileSync('.github/jules-queue-state.json', 'utf8'));

          console.log('Trigger:', process.env.GITHUB_EVENT_NAME);
          console.log('Queue state:', JSON.stringify(queue));
          if (next) {
            console.log('Next dispatchable task:', next.text);
          } else {
            console.log('Next Ready task: NONE');
          }
          NODE

      - name: Run orchestrator
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_SOURCE: sources/github/japiohopman/fundraiser
          JULES_API_TIMEOUT_MS: 60000
          GITHUB_API_TIMEOUT_MS: 30000
        run: node scripts/jules-orchestrator.mjs
